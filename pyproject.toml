[project]
name = "min-neurips2025"
version = "0.1.0"
description = "Mixture of Noise for Pre-Trained Model-Based Class-Incremental Learning"
requires-python = ">=3.10"
dependencies = [
    # transformers 5.5+ requires torch>=2.4 for AutoModel (DINOv3 via HF)
    "torch==2.4.1",
    "torchvision==0.19.1",
    "timm",
    "scikit-learn",
    "scipy",
    "einops>=0.8.2",
    "numpy<2",
    "transformers>=5.5.0",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu118" }]
torchvision = [{ index = "pytorch-cu118" }]
